<body class="flex min-h-screen items-center justify-center p-4 bg-surface-bright">
<main class="w-full max-w-md space-y-stack-md">
<!-- Logo Section -->
<div class="flex flex-col items-center text-center space-y-4">
<div class="w-14 h-14 rounded-full bg-surface-container overflow-hidden">
<img alt="User profile photo" class="w-full h-full object-cover" src="assets/imagens/logo_Equilibra.png">
</div>
<div>
<span class="font-headline-md text-headline-md font-bold text-[#68C3B5] dark:text-primary-fixed">equilibra</span>
<div class="h-1 w-12 bg-secondary-container mx-auto mt-2 rounded-full"></div>
</div>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest p-8 rounded-xl border border-outline-variant soft-shadow space-y-6">
<header class="text-center space-y-2">
<h2 class="font-headline-md text-headline-md text-on-surface">Acesso Administrativo</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Entre com suas credenciais para gerenciar a plataforma</p>
</header>
<form id="loginForm" class="space-y-stack-sm">
<!-- Email Field -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant block ml-1" for="email">E-mail Profissional</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-secondary transition-colors">mail</span>
<input class="w-full pl-12 pr-4 py-3 bg-surface-container-low border border-outline-variant rounded-lg font-body-md text-body-md focus:ring-2 focus:ring-secondary-container focus:border-secondary outline-none transition-all placeholder:text-on-tertiary-container" id="email" placeholder="nome@mindcare.edu" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant block ml-1" for="password">Senha</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-secondary transition-colors">lock</span>
<input class="w-full pl-12 pr-12 py-3 bg-surface-container-low border border-outline-variant rounded-lg font-body-md text-body-md focus:ring-2 focus:ring-secondary-container focus:border-secondary outline-none transition-all placeholder:text-on-tertiary-container" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>

<!-- Submit Button -->
<button id="btnLogin" class="w-full py-4 bg-primary text-on-primary font-label-md text-label-md font-bold rounded-lg hover:bg-primary-container active:scale-[0.98] transition-all flex items-center justify-center gap-2 mt-4" type="submit">
<span>Entrar</span>
<span class="material-symbols-outlined text-[20px]">login</span>
</button>
</form>
</div>
<!-- Footer / Security Tag -->
<footer class="flex flex-col items-center space-y-4">
<div class="flex items-center gap-2 px-4 py-2 bg-surface-container-high rounded-full border border-outline-variant">
<span class="material-symbols-outlined text-[18px] text-on-surface-variant" style="font-variation-settings: 'FILL' 1;">verified_user</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Ambiente Restrito a Administradores</span>
</div>
<p class="font-label-sm text-label-sm text-on-tertiary-fixed-variant opacity-70">
                © 2026 equilibra. Todos os direitos reservados.
            </p>
</footer>
</main>
<!-- Background Decorative Elements -->
<div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
<div class="absolute -top-[10%] -left-[5%] w-[40%] h-[40%] bg-surface-container-highest rounded-full blur-[100px] opacity-30"></div>
<div class="absolute top-[60%] -right-[10%] w-[50%] h-[50%] bg-secondary-container rounded-full blur-[120px] opacity-10"></div>
</div>
<script>
        // Simple Interaction logic
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.parentElement.classList.add('scale-[1.01]');
            });
            input.addEventListener('blur', () => {
                input.parentElement.parentElement.classList.remove('scale-[1.01]');
            });
        });

        // Toggle Password Visibility simulation
        const toggleBtn = document.querySelector('button[type="button"]');
        const passInput = document.getElementById('password');
        toggleBtn.addEventListener('click', () => {
            const isPass = passInput.type === 'password';
            passInput.type = isPass ? 'text' : 'password';
            toggleBtn.querySelector('span').textContent = isPass ? 'visibility_off' : 'visibility';
        });
        document
    .getElementById("loginForm")
    .addEventListener("submit", async (e) => {

        e.preventDefault();

        const email = document.getElementById("email").value;
        const senha = document.getElementById("password").value;

        const sucesso = await login(email, senha);

        if (sucesso) {

            window.location.href = "pages/home.html";

        }

    });
    </script>
